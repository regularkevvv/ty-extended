[project]
name = "ty-extended"
version = "0.89.0"
requires-python = ">=3.8"
dependencies = ["ty>=0.0.84,<0.1"]
description = "Extend Ty type checker with plugins. Write plugins in the Python subset supported by Monty."
readme = "README.md"
authors = [{ name = "Kevin Castro", email = "hola@kev.pe" }]
keywords = ["ty", "typing", "analysis", "check", "plugins"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/regularkevvv/ty-extended"
Changelog = "https://github.com/regularkevvv/ty-extended/blob/main/CHANGELOG.md"
Releases = "https://github.com/regularkevvv/ty-extended/releases"

[build-system]
requires = ["maturin==1.16.0", "wheel>=0.45.1,<0.47"]
build-backend = "build_backend"
backend-path = ["."]

[dependency-groups]
dev = ["prek==0.5.2"]
docs = [
    "mdformat>=0.7.17",
    "mdformat-admon>=2.0.2",
    "mdformat-mkdocs>=2.0.4",
    "mkdocs>=1.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-llmstxt>=0.2.0",
    "mkdocs-material>=9.7.0",
    "mkdocs-redirects>=1.2.2",
]
docker = [
    "cargo-zigbuild>=0.23.4",
]

[tool.uv]
no-build = true
exclude-newer = "P7D"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "dist-workspace.toml" },
    { file = "companion/Cargo.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "**/*.rs" },
]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.12"}
docs = {requires-python = ">=3.12"}
docker = {requires-python = ">=3.12"}

[tool.ruff]
extend-exclude = ["python/ty_extended/plugin_sdk.py", "crates/ty_plugin_host/python/ty_plugin_sdk.py"]
per-file-target-version = { "scripts/**" = "py313" }

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (error)
    "F",   # pyflakes
    "B",   # bugbear
    "B9",
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "I",   # isort
    "UP",  # pyupgrade
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "PYI", # flake8-pyi
    "RUF",
]

ignore = [
    # only relevant if you run a script with `python -0`,
    # which seems unlikely for any of the scripts in this repo
    "B011",
    # Leave it to the formatter to split long lines and
    # the judgement of all of us.
    "E501",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.maturin]
bindings = "bin"
manifest-path = "companion/Cargo.toml"
module-name = "ty_extended"
python-source = "python"
strip = true
include = [
    { path = "build_backend.py", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "crates/**", format = "sdist" },
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "companion/rust-toolchain.toml", format = "sdist" },
    { path = "dist-workspace.toml", format = [
        "sdist",
    ] },
    { path = "LICENSE", format = "sdist" },
]
