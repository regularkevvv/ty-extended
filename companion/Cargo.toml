[package]
name = "ty-extended"
version = "0.90.0"
edition = "2024"
rust-version = "1.98"
description = "Extend Ty type checker with plugins."
license = "MIT"
repository = "https://github.com/regularkevvv/ty-extended"
publish = false
exclude = ["evidence/**"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "0.9"
tempfile.workspace = true
globset = "0.4"
ignore = "0.4"
notify = "8.2"
ctrlc = "3.5"
mimalloc = { version = "=0.1.52", default-features = false, features = ["v2"] }
shellexpand = { version = "=3.1.2", default-features = false, features = ["base-0", "tilde"] }
ty_plugin_host = { path = "../crates/ty_plugin_host", default-features = false, features = ["plugins-monty"] }
ty_plugin_protocol = { path = "../crates/ty_plugin_protocol" }
ruff_python_parser = "=0.0.22"
ruff_python_ast = "=0.0.22"
ruff_text_size = "=0.0.22"
ruff_notebook = "=0.0.22"
ruff_diagnostics = "=0.0.22"

[target.'cfg(windows)'.dependencies]
dunce = { version = "=1.0.5", default-features = false }

