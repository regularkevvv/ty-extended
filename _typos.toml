[files]
extend-exclude = []

[default.extend-words]

[default]
extend-ignore-re = [
    # Content hashes and diagnostic fingerprints are opaque data.
    "\\b[0-9a-fA-F]{16,64}\\b",
    # Line ignore with trailing "spellchecker:disable-line"
    "(?Rm)^.*#\\s*spellchecker:disable-line$",
    "LICENSEs",
    "ntBre"
]
