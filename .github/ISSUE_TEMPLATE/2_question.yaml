name: Question
description: Ask a question about ty-extended and its plugins
labels: ["question"]
body:
  - type: textarea
    attributes:
      label: Question
      description: Describe your question in detail.
    validations:
      required: true

  - type: input
    attributes:
      label: ty-extended version
      description: Output of `ty-extended --version`.
      placeholder: e.g., ty-extended 0.90.0
    validations:
      required: false

  - type: input
    attributes:
      label: Official ty version
      description: Output of `ty --version`.
      placeholder: e.g., ty 0.0.104
    validations:
      required: false
