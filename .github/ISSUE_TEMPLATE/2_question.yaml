name: Question
description: Ask a question about the ty-extended Monty companion
labels: ["question"]
body:
  - type: textarea
    attributes:
      label: Question
      description: Describe your question in detail.
    validations:
      required: true

  - type: input
    attributes:
      label: Companion version
      description: Output of `ty-extended --version`.
      placeholder: e.g., ty-extended 0.87.0
    validations:
      required: false

  - type: input
    attributes:
      label: Official ty version
      description: Output of `ty --version`.
      placeholder: e.g., ty 0.0.99
    validations:
      required: false
