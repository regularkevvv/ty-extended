name: Publish django-ty to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: django-ty version to publish (must match plugins/django-ty/pyproject.toml)
        required: true
        type: string

permissions: {}

env:
  ACTIONS_CACHE_MODE: none

jobs:
  publish:
    name: Upload django-ty to PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Require the requested version to match the package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(grep -m1 '^version = "' plugins/django-ty/pyproject.toml | cut -d'"' -f2)"
          test "$RELEASE_VERSION" = "$package_version"
      - name: Require successful main CI for this exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/django-ty.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0].conclusion')"
          test "$conclusion" = success
      - name: Build wheel
        run: bash scripts/build-wheel.sh
        working-directory: plugins/django-ty
      - name: Verify the release wheel through installed CLI and LSP
        working-directory: plugins/django-ty
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/plugins/django-ty/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          target="$RUNNER_TEMP/django-ty-runtime"
          uv venv --python 3.13 "$target"
          uv pip install --python "$target/bin/python" "$wheel"
          "$target/bin/python" scripts/check_companion_install.py --output "$RUNNER_TEMP/django-ty-publish-smoke"
      - name: Attest the release distributions
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
        with:
          subject-path: plugins/django-ty/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: django-ty-published-distributions
          path: plugins/django-ty/dist/*
          retention-days: 5
      - name: Publish to PyPI
        run: uv publish dist/*
        working-directory: plugins/django-ty
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "django-ty-v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "django-ty $RELEASE_VERSION" \
            --notes "django-ty $RELEASE_VERSION" \
            plugins/django-ty/dist/*
