name: Build binaries
"on":
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  pull_request:
    paths:
      - pyproject.toml
      - dist-workspace.toml
      - rust-toolchain.toml
      - .github/workflows/build-binaries.yml
      - companion/**
      - python/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - scripts/test_plugin_wheel.py
      - build_backend.py
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  ACTIONS_CACHE_MODE: none
  PACKAGE_NAME: ty-extended
  PACKAGE_FILE_STEM: ty_extended
  MODULE_NAME: ty_extended
  PYTHON_VERSION: "3.13"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  BINARY_NAME: ty-extended
jobs:
  sdist:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          command: sdist
          args: --out dist
          rust-toolchain: 1.98.0
      - name: Test sdist
        uses: astral-sh/github-actions/release-smoke-test@3994daa59cb9d97f991f8196a17218a2641fce4b
        with:
          image: python:3.13-bookworm@sha256:933b46a028fd786c9c3d426ebabc237e29a15912231ea8de576e95f0e4f41a4c
          artifacts: dist
          rust-toolchain: companion/rust-toolchain.toml
          run: |
            # pip builds outside /test, where the toolchain file no longer applies.
            rustup default "$(rustup show active-toolchain | cut -d ' ' -f1)"
            # The sdist stem is the normalized package name (ty_extended-*, not
            # ty-extended-*). Install it by path: building the sdist needs maturin
            # from PyPI, so `--no-index` cannot be used here. `PACKAGE_FILE_STEM`
            # is not forwarded into this container, so glob the tarball directly;
            # this job's artifact mount only contains the sdist.
            pip install /dist/*.tar.gz --force-reinstall
            ty-extended --version
            ty-extended --help
            python -m ty_extended --help
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-sdist
          path: dist
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
  macos-x86_64:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'namespace-profile-macos-15' || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build wheels - x86_64
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          target: x86_64
          args: --release --locked --target-dir companion/target --out dist --compatibility pypi
          rust-toolchain: 1.98.0
        env:
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld64.lld -C link-arg=--icf=safe
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-macos-x86_64
          path: dist
      - name: Archive binary
        run: |
          TARGET=x86_64-apple-darwin
          ARCHIVE_NAME=ty-extended-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp companion/target/$TARGET/release/ty-extended $ARCHIVE_NAME/ty-extended
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-macos-x86_64
          path: |
            *.tar.gz
            *.sha256
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
  macos-aarch64:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'namespace-profile-macos-15' || 'macos-15' }}
    env:
      RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld64.lld -C link-arg=--icf=safe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build wheels - aarch64
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          target: aarch64
          rust-toolchain: 1.98.0
          args: --release --locked --target-dir companion/target --out dist --compatibility pypi
        env:
          CFLAGS: -fno-profile-generate -fno-profile-use
          CXXFLAGS: -fno-profile-generate -fno-profile-use
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
      - name: Test wheel - aarch64
        run: |
          pip install dist/"${PACKAGE_FILE_STEM}"-*.whl --force-reinstall
          ty --help
          python -m ty --help
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-aarch64-apple-darwin
          path: dist
      - name: Archive binary
        run: |
          TARGET=aarch64-apple-darwin
          ARCHIVE_NAME=ty-extended-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp companion/target/$TARGET/release/ty-extended $ARCHIVE_NAME/ty-extended
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-aarch64-apple-darwin
          path: |
            *.tar.gz
            *.sha256
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
  windows:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on:
      ${{ github.repository == 'astral-sh/ty' && matrix.platform.target == 'x86_64-pc-windows-msvc' && 'namespace-profile-windows-2022-x86-64-16x32'
      || 'windows-latest' }}
    strategy:
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.platform.arch }}
      - name: Install LLVM inspection tools
        id: pgo-toolchain
        working-directory: companion
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          echo "toolchain=$(rustc --version | cut -d ' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          target: ${{ matrix.platform.target }}
          rust-toolchain: 1.98.0
          args: --release --locked --target-dir companion/target --out dist --compatibility pypi
        env:
          XWIN_VERSION: 16
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
      - name: Verify static Windows runtime
        working-directory: companion
        shell: bash
        run: |
          RUST_HOST="$(rustc -vV | sed -n 's/^host: //p')"
          LLVM_READOBJ="$(rustc --print sysroot)/lib/rustlib/$RUST_HOST/bin/llvm-readobj.exe"
          IMPORTS_FILE="$RUNNER_TEMP/ty-coff-imports.txt"
          "$LLVM_READOBJ" --coff-imports "target/${{ matrix.platform.target }}/release/ty-extended.exe" > "$IMPORTS_FILE"

          if grep -Eiq 'vcruntime[[:digit:]_]*\.dll|api-ms-win-crt-|python[[:digit:]_]*\.dll' "$IMPORTS_FILE"; then
            echo "The standalone companion must not link Python or the dynamic Visual C++ runtime" >&2
            exit 1
          fi
      - name: Test wheel
        if: ${{ !startsWith(matrix.platform.target, 'aarch64') }}
        shell: bash
        run: |
          python -m pip install dist/"${PACKAGE_FILE_STEM}"-*.whl --force-reinstall
          ty-extended --version
          ty-extended --help
          python -m ty_extended --help
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist
      - name: Archive binary
        shell: bash
        run: |
          ARCHIVE_FILE=ty-extended-${{ matrix.platform.target }}.zip
          cp ./companion/target/${{ matrix.platform.target }}/release/ty-extended.exe ./ty-extended.exe
          7z a "$ARCHIVE_FILE" ./ty-extended.exe
          sha256sum "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: |
            *.zip
            *.sha256
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
    env:
      RUSTFLAGS: -C target-feature=+crt-static
  linux:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          rust-toolchain: 1.98.0
          manylinux: "2_17"
          args: --release --locked --target-dir companion/target --out dist --compatibility pypi
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
      - name: Test wheel
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        uses: astral-sh/github-actions/release-smoke-test@3994daa59cb9d97f991f8196a17218a2641fce4b
        with:
          image: python:3.13-bookworm@sha256:933b46a028fd786c9c3d426ebabc237e29a15912231ea8de576e95f0e4f41a4c
          artifacts: dist
          run: |
            # The wheel/sdist stem is the normalized package name (ty_extended-*, not ty-extended-*).
            pip install /dist/*.whl --force-reinstall
            ty-extended --version
            ty-extended --help
            python -m ty_extended --help
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - name: Archive binary
        shell: bash
        run: |
          set -euo pipefail

          TARGET=${{ matrix.target }}
          ARCHIVE_NAME=ty-extended-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp companion/target/$TARGET/release/ty-extended $ARCHIVE_NAME/ty-extended
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
  linux-aarch64:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on: ubuntu-24.04-arm
    env:
      JEMALLOC_SYS_WITH_LG_PAGE: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          target: aarch64-unknown-linux-gnu
          rust-toolchain: 1.98.0
          manylinux: "2_17"
          docker-options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          args: --release --locked --target-dir companion/target --out dist --compatibility pypi
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
      - name: Test wheel
        uses: astral-sh/github-actions/release-smoke-test@3994daa59cb9d97f991f8196a17218a2641fce4b
        with:
          image: python:3.13-bookworm@sha256:933b46a028fd786c9c3d426ebabc237e29a15912231ea8de576e95f0e4f41a4c
          platform: linux/arm64
          artifacts: dist
          run: |
            # The wheel/sdist stem is the normalized package name (ty_extended-*, not ty-extended-*).
            pip install /dist/*.whl --force-reinstall
            ty-extended --version
            ty-extended --help
            python -m ty_extended --help
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-aarch64-unknown-linux-gnu
          path: dist
      - name: Archive binary
        run: |
          set -euo pipefail

          TARGET=aarch64-unknown-linux-gnu
          ARCHIVE_NAME=ty-extended-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp companion/target/$TARGET/release/ty-extended $ARCHIVE_NAME/ty-extended
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: |
            *.tar.gz
            *.sha256
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
  musllinux:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: --release --locked --target-dir companion/target --out dist --compatibility pypi
          rust-toolchain: 1.98.0
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
      - name: Test wheel
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: astral-sh/github-actions/release-smoke-test@3994daa59cb9d97f991f8196a17218a2641fce4b
        with:
          image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          artifacts: dist
          run: |
            apk add python3
            python -m venv .venv
            .venv/bin/pip3 install /dist/*.whl --force-reinstall
            .venv/bin/ty-extended --help
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - name: Archive binary
        shell: bash
        run: |
          set -euo pipefail

          TARGET=${{ matrix.target }}
          ARCHIVE_NAME=ty-extended-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp companion/target/$TARGET/release/ty-extended $ARCHIVE_NAME/ty-extended
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
  musllinux-cross:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: aarch64-unknown-linux-musl
            test_platform: linux/arm64
            maturin_docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prep README.md
        run: python scripts/transform_readme.py
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.16.0
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --locked --target-dir companion/target --out dist --compatibility pypi
          docker-options: ${{ matrix.platform.maturin_docker_options }}
          rust-toolchain: 1.98.0
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
      - name: Test wheel
        uses: astral-sh/github-actions/release-smoke-test@3994daa59cb9d97f991f8196a17218a2641fce4b
        with:
          image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          platform: ${{ matrix.platform.test_platform }}
          artifacts: dist
          run: |
            apk add python3
            python -m venv .venv
            .venv/bin/pip3 install /dist/*.whl --force-reinstall
            .venv/bin/ty-extended --help
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist
      - name: Archive binary
        shell: bash
        run: |
          set -euo pipefail

          TARGET=${{ matrix.platform.target }}
          ARCHIVE_NAME=ty-extended-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp companion/target/$TARGET/release/ty-extended $ARCHIVE_NAME/ty-extended
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: |
            *.tar.gz
            *.sha256
      - name: Clean build artifacts
        if: always()
        shell: bash
        run: if [ -d companion/target ]; then cargo clean --manifest-path companion/Cargo.toml; fi
