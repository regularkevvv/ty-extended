name: ty-extended

permissions:
  contents: read

on:
  pull_request:
    paths:
      - companion/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/companion.yml
  push:
    branches: [main]
    paths:
      - companion/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/companion.yml
  workflow_dispatch:
    inputs:
      native_performance_only:
        description: Run only the isolated native Django comparison
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-host:
    name: Monty host isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/companion/target-host-check
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Verify isolated indexed calls and clean build artifacts
        shell: bash
        run: |
          trap 'cargo clean --manifest-path crates/ty_plugin_host/Cargo.toml' EXIT
          cargo +1.98.0 test --locked --manifest-path crates/ty_plugin_host/Cargo.toml --no-default-features --features plugins-monty --lib --test monty -- --test-threads=1
          cargo +1.98.0 clippy --locked --manifest-path crates/ty_plugin_host/Cargo.toml --no-default-features --features plugins-monty --lib --test monty -- -D warnings

  native-performance:
    name: Native Django performance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/companion/target-native-benchmark
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build and clean the benchmark candidate
        shell: bash
        run: |
          native_guard_environment="$RUNNER_TEMP/native-guard-environment"
          cleanup() {
            cargo clean --manifest-path companion/Cargo.toml
            rm -rf "$native_guard_environment"
          }
          trap cleanup EXIT
          python -m venv "$native_guard_environment"
          "$native_guard_environment/bin/python" -m pip install --disable-pip-version-check --no-cache-dir ty==0.0.104
          export TY_COMPANION_TEST_OFFICIAL="$native_guard_environment/bin/ty"
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended moved_response_indexes_preserve_exact_protocol_json -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended prepared_member_abstentions_preserve_routing_namespaces_and_failures -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended grouped_source_patterns_match_ordered_reference -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended prefetched_hooks_preserve_serial_responses_keys_and_failures -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended unique_import_resolution_preserves_waves_precedence_and_new_modules -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended third_party_overlay_declarations_require_all_plugins_and_valid_names -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended stateless_prefetched_batches_preserve_serial_keys_failures_and_revisions -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended source_class_lookups_preserve_snapshots_scopes_fallbacks_and_generations -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended one_shot_cli_discards_only_unused_clean_state -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended native_cli_attempts_do_not_reuse_discarded_provider_patches -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended early_native_reuse_requires_observed_selected_source_snapshots -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended preobserved_snapshot_reads_preserve_utf8_and_reject_changed_revisions -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended early_native_snapshot_rejects_changes_before_and_after_host_loading -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended settings_bootstrap_loads_only_contributed_provider_sources -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended native_cli_bootstrap_probe_preserves_exact_errors_and_requires_import_coverage -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended native_cli_partial_provider_matches_full_projection_and_preserves_originals -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended native_cli_reuse_matches_fresh_reports_and_rejects_changed_inputs -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended cached_module_directory_probes_match_direct_lookup_and_refresh -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended known_size_reads_preserve_utf8_growth_short_reads_and_io_errors -- --test-threads=1
          cargo +1.98.0 test --locked --release --manifest-path companion/Cargo.toml --bin ty-extended native_cli_requires_native_fields_unanimous_opt_in_and_boolean_config -- --test-threads=1
          cargo +1.98.0 build --locked --release --manifest-path companion/Cargo.toml --bin ty-extended
          cp "$CARGO_TARGET_DIR/release/ty-extended" "$RUNNER_TEMP/ty-extended-native"
      - name: Compare identical workloads and focused Django contracts
        run: python companion/scripts/native_django_benchmark.py --production-defaults --matrix --repeats 30 --companion "${{ runner.temp }}/ty-extended-native" --output "${{ runner.temp }}/native-django-evidence"
      - name: Preserve native Django reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-django-${{ matrix.os }}
          retention-days: 5
          path: |
            ${{ runner.temp }}/native-django-evidence/native-django.json
            ${{ runner.temp }}/native-django-evidence/**/benchmark.json
            ${{ runner.temp }}/native-django-evidence/**/focus.json
            ${{ runner.temp }}/native-django-evidence/**/result.json
            ${{ runner.temp }}/native-django-evidence/**/stderr.log
            ${{ runner.temp }}/native-django-evidence/**/stdout.json

  compatibility:
    name: Compatibility (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || !inputs.native_performance_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/companion/target
      CARGO_NET_RETRY: 10
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Run compiler, SDK, and real editor checks
        # Keep staged projects outside the repository's inherited Python config.
        run: python companion/scripts/ci.py --output "${{ runner.temp }}/companion-ci-evidence"
      - name: Preserve compatibility reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-${{ matrix.os }}
          retention-days: 5
          path: |
            ${{ runner.temp }}/companion-ci-evidence/ci.json
            ${{ runner.temp }}/companion-ci-evidence/**/evidence.json
            ${{ runner.temp }}/companion-ci-evidence/**/summary.json
            ${{ runner.temp }}/companion-ci-evidence/**/acceptance.json
            ${{ runner.temp }}/companion-ci-evidence/**/scalability.json
            ${{ runner.temp }}/companion-ci-evidence/**/benchmark.json
            ${{ runner.temp }}/companion-ci-evidence/django-scoped-requests.json
            ${{ runner.temp }}/companion-ci-evidence/**/probe.json
            ${{ runner.temp }}/companion-ci-evidence/**/*.stderr
            ${{ runner.temp }}/companion-ci-evidence/**/*.stdout
            ${{ runner.temp }}/companion-ci-evidence/**/stderr.log
            ${{ runner.temp }}/companion-ci-evidence/gates/*.log
            ${{ runner.temp }}/companion-ci-evidence/cli-edits/**

      - name: Clean build artifacts
        if: always()
        shell: bash
        run: cargo clean --manifest-path companion/Cargo.toml
