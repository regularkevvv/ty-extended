name: CI
permissions:
  contents: read
"on":
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      overlay_probe_only:
        description: Run the focused Windows overlay probe with existing build artifacts
        type: boolean
        default: false
      artifact_run_id:
        description: Successful Build binaries run containing the Windows x64 native archive
        type: string
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  PYTHON_VERSION: "3.13"
  PACKAGE_NAME: ty-extended
jobs:
  ruff-submodule-source:
    if: ${{ !inputs.overlay_probe_only }}
    name: ruff-extended submodule source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check Ruff submodule fork
        run: |
          url="$(git config --file .gitmodules --get submodule.ruff.url)"
          case "$url" in
            "https://github.com/regularkevvv/ruff-extended"|"https://github.com/regularkevvv/ruff-extended.git"|"git@github.com:regularkevvv/ruff-extended.git")
              ;;
            *)
              echo "Expected ruff submodule to point at ruff-extended; got: $url"
              exit 1
              ;;
          esac
  python-package:
    if: ${{ !inputs.overlay_probe_only }}
    name: python package
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Test PyPI README transformation
        run: python scripts/test_transform_readme.py
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          args: --release --locked --target-dir companion/target --out dist
          rust-toolchain: 1.98.0
          maturin-version: v1.16.0
      - name: Audit standalone binary wheel tags
        shell: bash
        run: |
          python -m pip install "wheel>=0.46,<0.47"
          python build_backend.py dist
          python scripts/test_build_backend.py
      - name: Test wheel
        run: |
          pip install dist/*.whl --force-reinstall
          ty --version
          ty-extended --version
          python -m ty_extended --help
          python scripts/test_plugin_wheel.py
      - name: Clean build artifacts
        run: |
          cargo clean --manifest-path companion/Cargo.toml
          rm -rf dist
        if: always()
  prek:
    if: ${{ !inputs.overlay_probe_only }}
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.12.23
          checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
      - name: Cache prek
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run prek
        run: |
          echo '```console' > "$GITHUB_STEP_SUMMARY"
          # Enable color output for prek and remove it for the summary
          # Use --hook-stage=manual to enable slower hooks that are skipped by default
          SKIP=cargo-fmt,clippy,dev-generate-all uv run --only-group dev --locked prek run --all-files --show-diff-on-failure --color always --hook-stage manual | \
            tee >(sed -E 's/\x1B\[([0-9]{1,2}(;[0-9]{1,2})*)?[mGK]//g' >> "$GITHUB_STEP_SUMMARY") >&1
          exit_code="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
  generated-check:
    if: ${{ !inputs.overlay_probe_only }}
    name: Check generated files unedited
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.12.23
          checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
      - name: Run auto generation scripts
        run: |
          ./scripts/autogenerate_files.sh
      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-x86_64-unknown-linux-gnu.tar.xz" -o /tmp/cargo-dist.tar.xz
          echo "${CARGO_DIST_CHECKSUM}  /tmp/cargo-dist.tar.xz" | sha256sum -c -
          tar -xf /tmp/cargo-dist.tar.xz -C /tmp
          install /tmp/cargo-dist-x86_64-unknown-linux-gnu/dist ~/.cargo/bin/
        env:
          CARGO_DIST_VERSION: 0.31.0
          CARGO_DIST_CHECKSUM: cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8
      - name: Verify reproducible release workflow
        run: |
          uv run --only-group docs --locked python scripts/test_generate_release_workflow.py
          uv run --only-group docs --locked python scripts/generate_release_workflow.py --check --dist "$HOME/.cargo/bin/dist"
      - name: Check for uncommitted changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Error: Auto-generated files were manually edited."
            echo "Files with changes:"
            git status --porcelain
            exit 1
          fi
  docs:
    if: ${{ !inputs.overlay_probe_only }}
    timeout-minutes: 10
    name: mkdocs
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.12.23
          checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
      - name: Build docs
        run: uv run --only-group=docs mkdocs build --strict -f mkdocs.yml

  overlay-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.overlay_probe_only }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        ty: ["0.0.84", "0.0.99"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Download existing native build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/overlay-probe/native"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/overlay-probe/source-run.json"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name artifacts-x86_64-pc-windows-msvc --dir "$RUNNER_TEMP/overlay-probe/native"
      - name: Install official checker and run focused probe
        shell: bash
        env:
          OFFICIAL_VERSION: ${{ matrix.ty }}
        run: |
          python -m pip install "ty==$OFFICIAL_VERSION"
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, zipfile
          from pathlib import Path
          from ty import find_ty_bin
          sys.path.insert(0, str(Path.cwd() / "companion/scripts"))
          from ci import reference_checker
          root = Path(os.environ["RUNNER_TEMP"]) / "overlay-probe"
          source = json.loads((root / "source-run.json").read_text())
          assert source["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          archive = root / "native/ty-extended-x86_64-pc-windows-msvc.zip"
          expected = archive.with_suffix(".zip.sha256").read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive) as payload:
              assert payload.namelist() == ["ty-extended.exe"]
              companion = root / "ty-extended.exe"
              companion.write_bytes(payload.read("ty-extended.exe"))
          reference = reference_checker(root, dict(os.environ))
          subprocess.run([sys.executable, "companion/scripts/overlay_reload_probe.py", "--companion", str(companion), "--official", find_ty_bin(), "--fork", str(reference), "--output", str(root / "reports")], check=True)
          repetitions = root / "repetitions"
          repetitions.mkdir()
          results = []
          for index in range(20):
              output = Path(os.environ["RUNNER_TEMP"]) / "companion-ci-evidence/sdk_overlay_inventory"
              command = [sys.executable, "companion/scripts/sdk_overlay_inventory.py", "--companion", str(companion), "--official", find_ty_bin(), "--fork", str(reference), "--output", str(output)]
              process = subprocess.run(command, capture_output=True, text=True)
              results.append({"iteration": index, "exit": process.returncode})
              (repetitions / f"{index}.stdout").write_text(process.stdout)
              (repetitions / f"{index}.stderr").write_text(process.stderr)
              if (output / "summary.json").is_file():
                  shutil.copy2(output / "summary.json", repetitions / f"{index}-summary.json")
              if output.exists():
                  shutil.rmtree(output)
              print("full inventory", index, process.returncode, flush=True)
          (repetitions / "results.json").write_text(json.dumps(results, indent=2))
          PY
      - name: Preserve probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: overlay-probe-${{ matrix.ty }}
          retention-days: 5
          path: |
            ${{ runner.temp }}/overlay-probe/source-run.json
            ${{ runner.temp }}/overlay-probe/reports/probe.json
            ${{ runner.temp }}/overlay-probe/reports/**/*.stderr
            ${{ runner.temp }}/overlay-probe/repetitions/*
