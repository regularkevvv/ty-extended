# Generated by scripts/generate_release_workflow.py using pinned cargo-dist.
# Edit dist-workspace.toml or .github/release-customizations.json and regenerate.
name: Release
permissions: {}
'on':
  pull_request: null
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        default: dry-run
        type: string
jobs:
  release-gate:
    name: release-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != 'dry-run' }}
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release-gate
      deployment: true
    steps:
    - run: echo "Release approved"
  plan:
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ (inputs.tag != 'dry-run' && inputs.tag) || '' }}
      tag-flag: ${{ inputs.tag && inputs.tag != 'dry-run' && format('--tag={0}', inputs.tag) || '' }}
      publishing: ${{ inputs.tag && inputs.tag != 'dry-run' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install dist
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-x86_64-unknown-linux-gnu.tar.xz" -o /tmp/cargo-dist.tar.xz
        echo "${CARGO_DIST_CHECKSUM}  /tmp/cargo-dist.tar.xz" | sha256sum -c -
        tar -xf /tmp/cargo-dist.tar.xz -C /tmp
        install /tmp/cargo-dist-x86_64-unknown-linux-gnu/dist ~/.cargo/bin/
    - name: Cache dist
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: cargo-dist-cache
        path: ~/.cargo/bin/dist
    - id: plan
      shell: bash
      run: |
        dist_args=(plan)
        if [[ -n "$DIST_TAG_FLAG" ]]; then
          dist_args=(host --steps=create "$DIST_TAG_FLAG")
        fi
        dist "${dist_args[@]}" --output-format=json > plan-dist-manifest.json
        echo "dist ran successfully"
        cat plan-dist-manifest.json
        echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      env:
        DIST_TAG_FLAG: ${{ inputs.tag && inputs.tag != 'dry-run' && format('--tag={0}', inputs.tag) || '' }}
    - name: Upload dist-manifest.json
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: artifacts-plan-dist-manifest
        path: plan-dist-manifest.json
    permissions:
      contents: write
  custom-build-binaries:
    needs:
    - plan
    if: ${{ needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload' || inputs.tag == 'dry-run' }}
    uses: ./.github/workflows/build-binaries.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    permissions:
      contents: read
  build-global-artifacts:
    needs:
    - plan
    - custom-build-binaries
    - generate-checksum-manifest
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install cached dist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cargo-dist-cache
        path: ~/.cargo/bin/
    - run: chmod +x ~/.cargo/bin/dist
    - name: Fetch local artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - id: cargo-dist
      shell: bash
      run: |
        dist_args=()
        if [[ -n "$DIST_TAG_FLAG" ]]; then
          dist_args+=("$DIST_TAG_FLAG")
        fi
        dist build "${dist_args[@]}" --output-format=json "--artifacts=global" > dist-manifest.json
        echo "dist ran successfully"

        # Parse out what we just built and upload it to scratch storage
        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      env:
        DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
    - name: Upload artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: artifacts-build-global
        path: |
          ${{ steps.cargo-dist.outputs.paths }}
          ${{ env.BUILD_MANIFEST_NAME }}
    permissions:
      contents: read
  host:
    needs:
    - plan
    - custom-build-binaries
    - build-global-artifacts
    - generate-checksum-manifest
    - release-gate
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.generate-checksum-manifest.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.custom-build-binaries.result == 'skipped' || needs.custom-build-binaries.result == 'success') && needs.release-gate.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install cached dist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cargo-dist-cache
        path: ~/.cargo/bin/
    - run: chmod +x ~/.cargo/bin/dist
    - name: Fetch artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - id: host
      shell: bash
      run: |
        dist_args=()
        if [[ -n "$DIST_TAG_FLAG" ]]; then
          dist_args+=("$DIST_TAG_FLAG")
        fi
        dist host "${dist_args[@]}" --steps=upload --steps=release --output-format=json > dist-manifest.json
        echo "artifacts uploaded and released successfully"
        cat dist-manifest.json
        echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      env:
        DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
    - name: Upload dist-manifest.json
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: artifacts-dist-manifest
        path: dist-manifest.json
    permissions:
      contents: write
    environment:
      name: release
  custom-publish-pypi:
    needs:
    - plan
    - host
    - release-gate
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: ./.github/workflows/publish-pypi.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  custom-publish-sdk-crates:
    needs:
    - plan
    - host
    - release-gate
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: ./.github/workflows/publish-sdk-crates.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  announce:
    needs:
    - plan
    - host
    - custom-publish-pypi
    - custom-publish-sdk-crates
    - release-gate
    if: ${{ always() && needs.host.result == 'success' && needs.release-gate.result == 'success' && (needs.custom-publish-pypi.result == 'skipped' || needs.custom-publish-pypi.result == 'success') && (needs.custom-publish-sdk-crates.result == 'skipped' || needs.custom-publish-sdk-crates.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        persist-credentials: false
        submodules: recursive
    - name: Download GitHub Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: artifacts-*
        path: artifacts
        merge-multiple: true
    - name: Cleanup
      run: |
        # Remove the granular manifests
        rm -f artifacts/*-dist-manifest.json
    - name: Attest
      uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
      with:
        subject-path: |
          artifacts/*.json
          artifacts/*.sh
          artifacts/*.ps1
          artifacts/*.zip
          artifacts/*.tar.gz
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PRERELEASE_FLAG: ${{ fromJson(needs.host.outputs.val).announcement_is_prerelease && '--prerelease' || '' }}
        ANNOUNCEMENT_TITLE: ${{ fromJson(needs.host.outputs.val).announcement_title }}
        ANNOUNCEMENT_BODY: ${{ fromJson(needs.host.outputs.val).announcement_github_body }}
        RELEASE_COMMIT: ${{ github.sha }}
        NEEDS_PLAN_OUTPUTS_TAG: ${{ needs.plan.outputs.tag }}
      run: |
        printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
        release_args=(release create "$NEEDS_PLAN_OUTPUTS_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt")
        if [[ "$PRERELEASE_FLAG" == '--prerelease' ]]; then release_args+=(--prerelease); fi
        gh "${release_args[@]}" artifacts/*
    environment:
      name: release
  generate-checksum-manifest:
    needs:
    - plan
    - custom-build-binaries
    if: ${{ needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload' || inputs.tag == 'dry-run' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: 0.12.23
        checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
        enable-cache: false
    - name: Install cached dist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cargo-dist-cache
        path: ~/.cargo/bin/
    - run: chmod +x ~/.cargo/bin/dist
    - name: Fetch local artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - name: Generate local dist manifest
      shell: bash
      env:
        DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
      run: |
        dist_args=()
        if [[ -n "$DIST_TAG_FLAG" ]]; then
          dist_args+=("$DIST_TAG_FLAG")
        fi
        temp_manifest=target/local-dist-manifest.json.tmp
        dist manifest "${dist_args[@]}" --output-format=json --no-local-paths --artifacts=local > "$temp_manifest"
        uv run --locked scripts/patch-dist-manifest-checksums.py --manifest "$temp_manifest" --artifacts-dir target/distrib
        mv "$temp_manifest" target/distrib/local-dist-manifest.json
    - name: Upload synthesized local dist manifest
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: artifacts-build-local-manifest
        path: target/distrib/local-dist-manifest.json
env:
  ACTIONS_CACHE_MODE: none
  CARGO_DIST_VERSION: 0.31.0
  CARGO_DIST_CHECKSUM: cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8
